entity: williamgevao202-concordia-university
project: deep-hedging-compare
name: SGD_sweep
program: rla_pinns/train.py
command:
    - ${env}
    - python
    - ${program}
    - "--wandb"
    - "--optimizer=SGD"
    - "--equation=black-scholes-logS"
    - ${args}
metric:
    goal: minimize
    name: l2_error
method: random
run_cap: 50
parameters:
    batch_frequency:
        value: 1
    boundary_condition:
        value: call_payoff
    model:
        value: mlp-tanh-64
    dtype:
        value: float64
    num_seconds:
        value: 6000
    dim_Omega:
        value: 1
    N_Omega:
        value: 3_000
    N_dOmega:
        value: 500
    SGD_lr:
        distribution: log_uniform_values
        min: 1e-3
        max: 1e-2
    SGD_momentum:
        distribution: categorical
        values: [0.0, 0.3, 0.6, 0.9]