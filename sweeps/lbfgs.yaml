entity: williamgevao202-concordia-university
project: rla-pinns-rla_pinns
name: LBFGS_sweep
program: rla_pinns/train.py
command:
    - ${env}
    - python
    - ${program}
    - "--wandb"
    - "--optimizer=LBFGS"
    - "--equation=black-scholes-logS"
    - ${args}
metric:
    goal: minimize
    name: l2_error
method: random
run_cap: 20
parameters:
    batch_frequency:
        value: 1
    boundary_condition:
        value: call_payoff
    model:
        value: mlp-tanh-64
    dtype:
        value: float64
    num_seconds:
        value: 3000
    dim_Omega:
        value: 1
    N_Omega:
        value: 3_000
    N_dOmega:
        value: 500
    LBFGS_lr:
        distribution: log_uniform_values
        min: 1e-2
        max: 1.0
    LBFGS_history_size:
        distribution: categorical
        values: [50, 100, 200]