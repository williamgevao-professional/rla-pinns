entity: williamgevao202-concordia-university
project: bsb-100d-sweeps
name: bsb100_KFAC
program: rla_pinns/train.py
command:
- ${env}
- python
- ${program}
- --wandb
- --optimizer=KFAC
- --equation=bsb-logS
- ${args_no_boolean_flags}
metric:
  goal: minimize
  name: rl2_error_path
method: random
run_cap: 16
parameters:
  boundary_condition:
    value: bsb_payoff
  dim_Omega:
    value: 100
  model:
    value: mlp-tanh-64-64-48-48
  dtype:
    value: float64
  num_seconds:
    value: 3000
  N_Omega:
    value: 3000
  N_dOmega:
    value: 500
  interior_sampling:
    value: path
  batch_frequency:
    value: 1
  KFAC_damping:
    distribution: log_uniform_values
    min: 1.0e-08
    max: 0.1
  KFAC_kfac_approx:
    distribution: categorical
    values:
    - expand
    - reduce
  KFAC_ggn_type:
    distribution: categorical
    values:
    - type-2
    - empirical
  KFAC_damping_heuristic:
    distribution: categorical
    values:
    - same
    - trace-norm
