entity: williamgevao202-concordia-university
project: deep-hedging-compare
name: HessianFree_sweep
program: rla_pinns/train.py
command:
    - ${env}
    - python
    - ${program}
    - "--wandb"
    - "--optimizer=HessianFree"
    - "--equation=black-scholes-logS"
    - ${args}
metric:
    goal: minimize
    name: l2_error
method: random
run_cap: 50
parameters:
    batch_frequency:
        value: 1
    boundary_condition:
        value: call_payoff
    model:
        value: mlp-tanh-64
    dtype:
        value: float64
    num_seconds:
        value: 6000
    dim_Omega:
        value: 1
    N_Omega:
        value: 3_000
    N_dOmega:
        value: 500
    HessianFree_damping:
        distribution: log_uniform_values
        min: 1e-3
        max: 1e0
    HessianFree_cg_max_iter:
        distribution: categorical
        values: [100, 150, 200, 250, 300, 350]


