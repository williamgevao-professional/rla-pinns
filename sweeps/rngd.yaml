entity: williamgevao202-concordia-university
project: rla-pinns-rla_pinns
name: RNGD_sweep
program: rla_pinns/train.py
command:
    - ${env}
    - python
    - ${program}
    - "--wandb"
    - "--optimizer=RNGD"
    - "--equation=black-scholes-logS"
    - ${args_no_boolean_flags}
metric:
    goal: minimize
    name: l2_error
method: random
run_cap: 20
parameters:
    batch_frequency:
        value: 1
    boundary_condition:
        value: call_payoff
    model:
        value: mlp-tanh-64
    dtype:
        value: float64
    num_seconds:
        value: 3000
    dim_Omega:
        value: 1
    N_Omega:
        value: 3_000
    N_dOmega:
        value: 500
    RNGD_approximation:
        value: "exact"
    RNGD_damping:
        distribution: log_uniform_values
        min: 1e-15
        max: 1e-5